name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bugtracker_backend_database_user
          POSTGRES_PASSWORD: testing
          POSTGRES_DB: bugtracker_backend_database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bugtracker_backend_database_user -d bugtracker_backend_database"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      SESSIONS_SECRET: testing
      PGUSER: bugtracker_backend_database_user
      PGPASSWORD: testing
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: bugtracker_backend_database
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v5

      - name: Enable pnpm via corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load database schema
        run: psql "postgresql://bugtracker_backend_database_user:testing@localhost:5432/bugtracker_backend_database" -v ON_ERROR_STOP=1 -f bugtracker.sql

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build -t bugtracker-api:ci --target prod app
