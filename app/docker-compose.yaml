# The top-level `version:` key is obsolete in Compose v2 and has been removed.
services:
  api:
    build:
      context: .
      target: dev
    environment:
      NODE_ENV: development
      SESSIONS_SECRET: testing
      PGUSER: bugtracker_backend_database_user
      PGPASSWORD: testing
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: bugtracker_backend_database
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTIC_HOST: elasticsearch_container
      ELASTIC_PORT: 9200
    ports:
      - 3000:3000 # host:container
    volumes:
      - .:/usr/src/app
      # Keep the image's node_modules; don't let the host bind mount hide them.
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:8
    container_name: redis_container
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:18
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c random_page_cost=1.0
    container_name: postgres_container
    environment:
      POSTGRES_USER: bugtracker_backend_database_user
      POSTGRES_PASSWORD: testing
      POSTGRES_DB: bugtracker_backend_database
    # Override PG_HOST_PORT when something else already owns 5432 on your machine.
    ports:
      - '${PG_HOST_PORT:-5432}:5432'
    volumes:
      - ./bugtracker.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bugtracker_backend_database_user -d bugtracker_backend_database']
      interval: 2s
      timeout: 3s
      retries: 15

  pgadmin:
    image: dpage/pgadmin4:9.14
    container_name: pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: 'dev@dev.dev'
      PGADMIN_DEFAULT_PASSWORD: 'dev'
      PGADMIN_LISTEN_PORT: 80
    ports:
      - '${PGADMIN_HOST_PORT:-8080}:80'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - ./pgadmin/pgpassfile:/pgpassfile
